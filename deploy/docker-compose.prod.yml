# Боевой стенд ИОН (срез 28, T-26, T-27): Caddy с HTTPS, две копии сервера, воркер, PostgreSQL с непрерывным
# архивом, ClamAV, копии базы и файлов. Хранилища файлов и копий и почтовый сервис внешние (S3-совместимые и SMTP).
#
# Запуск:    см. docs/DEPLOY.md. Коротко:  cd deploy && ./init-secrets.sh && cp env.example .env && $EDITOR .env
#            ./deploy.sh <версия образа>
# Проверка:  docker compose -f deploy/docker-compose.prod.yml config   (все ли переменные заданы)
#
# Что не публикуется наружу: сервер (8080), внутренний порт (9100/9101), база, ClamAV. Наружу смотрит только Caddy
# (80 и 443). Мониторинг (профиль `monitoring`) слушает только 127.0.0.1 сервера: заходить через `ssh -L`.
name: scibox-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Настройки сервера, общие для копий, воркера и шага выкладки. Секреты — только файлами (`*_FILE`, срез 28).
x-app-env: &app-env
  SCIBOX_ENV: production
  SCIBOX_PUBLIC_URL: https://${SCIBOX_DOMAIN:?задайте SCIBOX_DOMAIN в deploy/.env}${PUBLIC_PORT_SUFFIX:-}
  SCIBOX_HTTP_ADDR: 0.0.0.0:8080
  SCIBOX_BACKGROUND: "off"
  SCIBOX_OPS_ADDR: 0.0.0.0:9100
  SCIBOX_PPROF: "off"
  # Доверяем X-Forwarded-For только Caddy (его адрес в сети edge задан жёстко, CADDY_IP): посетитель подделать его
  # не может. Если меняете CADDY_IP или подсеть, меняйте и TRUSTED_PROXIES.
  SCIBOX_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.10.2/32}
  SCIBOX_SMTP_ADDR: ${SMTP_ADDR:?задайте SMTP_ADDR (хост:порт почтового сервиса)}
  SCIBOX_SMTP_TLS: ${SMTP_TLS:-starttls}
  SCIBOX_SMTP_USER: ${SMTP_USER:-}
  SCIBOX_MAIL_FROM: ${MAIL_FROM:?задайте MAIL_FROM}
  SCIBOX_S3_ENDPOINT: ${S3_ENDPOINT:?задайте S3_ENDPOINT (хранилище файлов)}
  SCIBOX_S3_BUCKET: ${S3_BUCKET:?задайте S3_BUCKET}
  SCIBOX_S3_REGION: ${S3_REGION:-us-east-1}
  SCIBOX_S3_TLS: "on"
  SCIBOX_S3_PATH_STYLE: ${S3_PATH_STYLE:-off}
  SCIBOX_S3_CREATE_BUCKET: "off"
  SCIBOX_CLAMAV_ADDR: clamav:3310
  SCIBOX_CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
  SCIBOX_LOG_LEVEL: ${LOG_LEVEL:-info}
  SCIBOX_ERROR_DSN: ${SCIBOX_ERROR_DSN:-}
  SCIBOX_SHUTDOWN_TIMEOUT: 20s
  SCIBOX_SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL:-15s}
  SCIBOX_DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  # Секреты из томов secrets-init (владелец uid 65532, права 600).
  DATABASE_URL_FILE: /run/secrets/database_url
  SCIBOX_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  SCIBOX_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  SCIBOX_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  SCIBOX_OPS_TOKEN_FILE: /run/secrets/ops_token
  SSL_CERT_DIR: ${EXTRA_CA_DIR:-/etc/ssl/certs}

# Параметры pgBackRest: общие для базы (архив журнала), копировщика и проверки восстановления. Секреты — файлами,
# scibox-entrypoint превращает `*_FILE` в значения окружения процесса.
x-pgbackrest-env: &pgbackrest-env
  PGBACKREST_STANZA: main
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_PATH: /pgbackrest
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?задайте BACKUP_S3_ENDPOINT (хранилище копий)}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:?задайте BACKUP_S3_BUCKET}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
  PGBACKREST_REPO1_S3_KEY_FROM_FILE: /run/secrets/backup_s3_access_key
  PGBACKREST_REPO1_S3_KEY_SECRET_FROM_FILE: /run/secrets/backup_s3_secret_key
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS_FROM_FILE: /run/secrets/backup_cipher_pass
  PGBACKREST_REPO1_S3_CA_FILE: ${BACKUP_S3_CA_FILE:-}
  PGBACKREST_LOG_LEVEL_CONSOLE: warn
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  BACKUP_FULL_EVERY_DAYS: ${BACKUP_FULL_EVERY_DAYS:-7}

x-app: &app
  image: ${SCIBOX_IMAGE:-scibox:dev}
  pull_policy: ${SCIBOX_PULL_POLICY:-missing}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  mem_limit: ${APP_MEMORY:-1g}
  stop_grace_period: 40s
  logging: *logging
  environment:
    <<: *app-env
  volumes:
    - secrets_app:/run/secrets:ro
  networks: [backend]
  depends_on:
    secrets-init:
      condition: service_completed_successfully
    release:
      condition: service_completed_successfully

services:
  # Раскладывает секреты из deploy/secrets/ по именованным томам с нужным владельцем (процессы сервера работают от
  # uid 65532, Prometheus от nobody, Grafana от 472): так файлы на сервере остаются root:root 600, а каждому
  # процессу виден только свой набор. Запускается при каждой выкладке (deploy.sh) и перед стартом зависимых.
  secrets-init:
    image: ${DB_IMAGE:-scibox-postgres:16.15}
    entrypoint: ["/bin/sh", "/init-secrets-volumes.sh"]
    restart: "no"
    read_only: true
    volumes:
      - ./secrets:/in:ro
      - ./init-secrets-volumes.sh:/init-secrets-volumes.sh:ro
      - secrets_app:/out/app
      - secrets_monitoring:/out/monitoring
      - secrets_grafana:/out/grafana
    networks: [backend]
    pull_policy: never

  postgres:
    build: ./postgres
    image: ${DB_IMAGE:-scibox-postgres:16.15}
    restart: unless-stopped
    environment:
      <<: *pgbackrest-env
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --data-checksums
      SCIBOX_DB_PASSWORD_FROM_FILE: /run/secrets/db_password
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=1000
      # Значения параметров запроса в журнал базы не попадают: иначе медленный запрос оставил бы там почты, имена и хеши
      # (срез 29, CRY-2; I-54 касается только журнала сервера).
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_line_prefix=%m [%p] %q%u@%d 
    shm_size: 1gb
    stop_grace_period: 120s
    secrets:
      - db_admin_password
      - db_password
      - backup_s3_access_key
      - backup_s3_secret_key
      - backup_cipher_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    networks: [backend]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d scibox"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Копии (T-26, D-184): планировщик полных и разностных копий базы и копии файлов, метрики для тревог.
  # Тот же образ, процесс от postgres (gosu в scibox-entrypoint).
  backup:
    image: ${DB_IMAGE:-scibox-postgres:16.15}
    pull_policy: never
    restart: unless-stopped
    command: ["scibox-backup"]
    environment:
      <<: *pgbackrest-env
      FILES_S3_ENDPOINT: ${S3_ENDPOINT}
      FILES_S3_BUCKET: ${S3_BUCKET}
      FILES_S3_REGION: ${S3_REGION:-us-east-1}
      FILES_S3_PATH_STYLE: ${S3_PATH_STYLE:-off}
      FILES_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      FILES_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
      BACKUP_S3_ACCESS_KEY_FILE: /run/secrets/backup_s3_access_key
      BACKUP_S3_SECRET_KEY_FILE: /run/secrets/backup_s3_secret_key
      BACKUP_FILES_CRYPT_PASS_FILE: /run/secrets/backup_files_crypt_pass
      BACKUP_DIFF_EVERY_HOURS: ${BACKUP_DIFF_EVERY_HOURS:-24}
      BACKUP_FILES_EVERY_HOURS: ${BACKUP_FILES_EVERY_HOURS:-24}
      SSL_CERT_DIR: ${EXTRA_CA_DIR:-/etc/ssl/certs}
    secrets:
      - s3_access_key
      - s3_secret_key
      - backup_s3_access_key
      - backup_s3_secret_key
      - backup_cipher_pass
      - backup_files_crypt_pass
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
      - backup_state:/state
      - backup_textfile:/textfile
    networks: [backend]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s

  # Проверка восстановления (T-26): `make restore-check` или `docker compose --profile tools run --rm restore-check`.
  restore-check:
    image: ${DB_IMAGE:-scibox-postgres:16.15}
    pull_policy: never
    command: ["scibox-restore-check"]
    environment:
      <<: *pgbackrest-env
      FILES_S3_ENDPOINT: ${S3_ENDPOINT}
      FILES_S3_BUCKET: ${S3_BUCKET}
      FILES_S3_REGION: ${S3_REGION:-us-east-1}
      FILES_S3_PATH_STYLE: ${S3_PATH_STYLE:-off}
      FILES_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      FILES_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
      BACKUP_S3_ACCESS_KEY_FILE: /run/secrets/backup_s3_access_key
      BACKUP_S3_SECRET_KEY_FILE: /run/secrets/backup_s3_secret_key
      BACKUP_FILES_CRYPT_PASS_FILE: /run/secrets/backup_files_crypt_pass
      SSL_CERT_DIR: ${EXTRA_CA_DIR:-/etc/ssl/certs}
    secrets:
      - s3_access_key
      - s3_secret_key
      - backup_s3_access_key
      - backup_s3_secret_key
      - backup_cipher_pass
      - backup_files_crypt_pass
    volumes:
      - backup_state:/state:ro
      - restore_scratch:/restore
    networks: [backend]
    profiles: ["tools"]

  # Восстановление базы в пустой том (авария на новом сервере, docs/DEPLOY.md, раздел 9):
  #   ./compose --profile tools run --rm restore            последнее состояние
  #   RESTORE_TARGET_TIME="2026-10-11 12:30:00+03" ./compose --profile tools run --rm restore   на момент времени
  restore:
    image: ${DB_IMAGE:-scibox-postgres:16.15}
    pull_policy: never
    command: ["scibox-restore"]
    environment:
      <<: *pgbackrest-env
      RESTORE_TARGET_TIME: ${RESTORE_TARGET_TIME:-}
    secrets:
      - backup_s3_access_key
      - backup_s3_secret_key
      - backup_cipher_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    profiles: ["tools"]

  # Шаг выкладки: миграции и справочник журналов. Запускается до замены копий (deploy.sh) и перед стартом
  # зависимых сервисов. Повторяем: второй запуск ничего не делает.
  release:
    <<: *app
    command: ["release"]
    restart: "no"
    environment:
      <<: *app-env
      SCIBOX_OPS_ADDR: "off"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  app1:
    <<: *app
    command: ["serve"]
    healthcheck: &app-health
      test: ["CMD", "/app/scibox", "healthcheck", "serve"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 40s
    networks: [edge, backend]

  app2:
    <<: *app
    command: ["serve"]
    healthcheck: *app-health
    networks: [edge, backend]

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      SCIBOX_OPS_ADDR: 0.0.0.0:9101
    healthcheck:
      test: ["CMD", "/app/scibox", "healthcheck", "worker"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 40s

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.5.4}
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: ${CLAMAV_MEMORY:-3g}
    networks: [backend]
    logging: *logging
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # При первом запуске freshclam скачивает базы сигнатур (сотни мегабайт).
      start_period: 600s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      SCIBOX_DOMAIN: ${SCIBOX_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/site.caddy:/etc/caddy/site.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        ipv4_address: ${CADDY_IP:-172.28.10.2}
    logging: *logging
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  # --- Мониторинг (профиль monitoring): docker compose --profile monitoring up -d ---
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    restart: unless-stopped
    profiles: ["monitoring"]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
      - secrets_monitoring:/run/secrets:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9190}:9090"
    networks: [backend]
    logging: *logging
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    restart: unless-stopped
    profiles: ["monitoring"]
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
      - secrets_monitoring:/run/secrets:ro
    networks: [backend]
    logging: *logging
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.10.2}
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup_textfile:/textfile:ro
    pid: host
    networks: [backend]
    logging: *logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.3}
    restart: unless-stopped
    profiles: ["monitoring"]
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3100}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - secrets_grafana:/run/secrets:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    networks: [backend]
    logging: *logging
    depends_on:
      secrets-init:
        condition: service_completed_successfully

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_password:
    file: ./secrets/db_password
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  backup_s3_access_key:
    file: ./secrets/backup_s3_access_key
  backup_s3_secret_key:
    file: ./secrets/backup_s3_secret_key
  backup_cipher_pass:
    file: ./secrets/backup_cipher_pass
  backup_files_crypt_pass:
    file: ./secrets/backup_files_crypt_pass

networks:
  # Caddy и копии сервера: адрес Caddy задан жёстко (CADDY_IP), его одного сервер считает доверенным прокси.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.10.0/24}
          # Остальным контейнерам адреса выдаются из верхней половины: младшие (в том числе CADDY_IP) остаются свободными,
          # иначе копия сервера, запущенная раньше Caddy, заняла бы его адрес.
          ip_range: ${EDGE_IP_RANGE:-172.28.10.128/25}
  backend:
    driver: bridge

volumes:
  pgdata:
  pgsocket:
  backup_state:
  backup_textfile:
  restore_scratch:
  clamav_db:
  caddy_data:
  caddy_config:
  secrets_app:
  secrets_monitoring:
  secrets_grafana:
  prometheus_data:
  alertmanager_data:
  grafana_data:
