# Автоматические проверки при каждой отправке в GitHub (срез 18, T-03).
# Те же проверки, что make test на Mac: линтер, уязвимости, тесты сервера с порогами покрытия
# (с -race, на настоящей PostgreSQL), тесты сайта с порогами. Красная проверка = в main не вливать.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Новая отправка в ту же ветку отменяет старый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Только чтение: проверкам ничего не нужно менять в репозитории.
permissions:
  contents: read

jobs:
  server:
    name: server tests (race, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Образ тот же, что в docker-compose.yml; GitHub сам скачивает его и запускает рядом с заданием.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: scibox
          POSTGRES_PASSWORD: scibox
          POSTGRES_DB: scibox
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scibox -d scibox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://scibox:scibox@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod # берёт версию из строки toolchain (go1.26.9)
          cache-dependency-path: server/go.sum
      - name: go mod tidy leaves go.mod and go.sum unchanged
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go mod verify
        working-directory: server
        run: go mod verify
      - name: file storage (SeaweedFS) and antivirus (ClamAV) from docker-compose.yml
        run: docker compose up -d --wait s3 clamav
      - name: vet, tests with -race, coverage thresholds
        run: ./scripts/coverage-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # та же версия, что у make lint на Mac (README, «Окружение»)
          working-directory: server

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: known vulnerabilities on code paths
        run: make vulncheck

  web:
    name: site (typecheck, oxlint, tests with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  monitoring:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: syntax and tests of the Prometheus alert rules
        run: make monitoring-check

  # Образы и боевая конфигурация (срез 28, T-27): образ собирается, в нём нет исправимых HIGH/CRITICAL, боевой compose
  # проходит проверку с тестовыми значениями, скрипты копий и выкладки синтаксически верны.
  image:
    name: image (build, trivy, compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: build the server image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t scibox:ci .
      - name: image runs as non-root with read-only filesystem and refuses unsafe settings
        run: |
          test "$(docker inspect -f '{{.Config.User}}' scibox:ci)" = "65532:65532"
          docker run --rm --read-only scibox:ci version
          ! docker run --rm --read-only scibox:ci serve
      - name: trivy scan of the server image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scibox:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"
      - name: build the database and backup image
        run: docker build -t scibox-postgres:ci deploy/postgres
      - name: trivy scan of the database image (OS packages)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scibox-postgres:ci
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"
      - name: production compose is valid (rehearsal values)
        run: |
          deploy/local/prepare.sh
          SCIBOX_DEPLOY_LOCAL=1 deploy/compose config -q
      - name: deploy scripts are valid shell
        run: |
          for f in deploy/*.sh deploy/compose deploy/local/*.sh deploy/postgres/initdb/*.sh deploy/postgres/bin/scibox-entrypoint; do sh -n "$f"; done
          for f in deploy/postgres/bin/scibox-backup deploy/postgres/bin/scibox-backup-lib deploy/postgres/bin/scibox-archive-now deploy/postgres/bin/scibox-restore-check deploy/postgres/initdb/10-scibox.sh; do bash -n "$f"; done
