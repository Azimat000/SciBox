# Автоматические проверки при каждой отправке в GitHub (срез 18, T-03).
# Те же проверки, что make test на Mac: линтер, уязвимости, тесты сервера с порогами покрытия
# (с -race, на настоящей PostgreSQL), тесты сайта с порогами. Красная проверка = в main не вливать.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Новая отправка в ту же ветку отменяет старый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Только чтение: проверкам ничего не нужно менять в репозитории.
permissions:
  contents: read

jobs:
  server:
    name: server tests (race, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Образ тот же, что в docker-compose.yml; GitHub сам скачивает его и запускает рядом с заданием.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: scibox
          POSTGRES_PASSWORD: scibox
          POSTGRES_DB: scibox
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scibox -d scibox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://scibox:scibox@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod # берёт версию из строки toolchain (go1.26.6)
          cache-dependency-path: server/go.sum
      - name: go mod tidy leaves go.mod and go.sum unchanged
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go mod verify
        working-directory: server
        run: go mod verify
      - name: vet, tests with -race, coverage thresholds
        run: ./scripts/coverage-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # та же версия, что у make lint на Mac (README, «Окружение»)
          working-directory: server

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: known vulnerabilities on code paths
        run: make vulncheck

  web:
    name: site (typecheck, oxlint, tests with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
