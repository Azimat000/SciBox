version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/dbgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type:
              type: int16
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
