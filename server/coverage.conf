# Пороги покрытия сервера. Источник правил: docs/TESTING.md (D-026).
# Проверяет scripts/coverage-check (вызывается из make test).

include scibox/server/internal/
exclude scibox/server/internal/dbgen   # код, сгенерированный sqlc

min 90

# Критичные зоны: порог 97% включается сам, как только пакет появится.
critical scibox/server/internal/auth         97   # аккаунты, сессии, пароли
critical scibox/server/internal/access       97   # роли и права в организациях
critical scibox/server/internal/orgs         97   # организации, сотрудники, приглашения: выдают и забирают права
critical scibox/server/internal/privacy      97   # приватность профиля
critical scibox/server/internal/references   97   # рекомендательные письма
critical scibox/server/internal/applications 97   # отклики, статусы, приглашения
critical scibox/server/internal/files        97   # загрузка и выдача файлов
critical scibox/server/internal/matching     97   # подбор, подписки, напоминания
