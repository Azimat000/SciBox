# Пороги покрытия сервера. Источник правил: docs/TESTING.md (D-026).
# Проверяет scripts/coverage-check (вызывается из make test).

include scibox/server/internal/
exclude scibox/server/internal/dbgen   # код, сгенерированный sqlc
exclude scibox/server/internal/testkit # помощники для тестов (в боевом коде не используется)
exclude scibox/server/internal/testaudit # помощники для тестов журнала действий (срез 21)

min 90

# Критичные зоны: порог 97% включается сам, как только пакет появится.
critical scibox/server/internal/auth         97   # аккаунты, сессии, пароли
critical scibox/server/internal/access       97   # роли и права в организациях
critical scibox/server/internal/orgs         97   # организации, сотрудники, приглашения: выдают и забирают права
critical scibox/server/internal/vacancies     97   # вакансии: кто видит и ведёт, жизненный цикл
critical scibox/server/internal/privacy      97   # приватность профиля: кто видит профиль и контакты
critical scibox/server/internal/profiles     97   # профиль учёного: что из него уходит другим людям
critical scibox/server/internal/references   97   # рекомендательные письма
critical scibox/server/internal/applications 97   # отклики, статусы, приглашения
critical scibox/server/internal/files        97   # загрузка и выдача файлов
critical scibox/server/internal/matching     97   # подбор, подписки, напоминания
critical scibox/server/internal/offers        97   # приглашения учёных на вакансии: кому можно писать от имени организации
critical scibox/server/internal/notifications 97  # уведомления и очередь писем: не слать дважды, не слать чужое
critical scibox/server/internal/httpguard     97  # периметр HTTP: сроки, заголовки защиты, настоящий IP, лимиты тела и частоты (срез 19)
critical scibox/server/internal/config        97  # настройки: боевой режим не даёт запуститься с опасными значениями (срез 19)
critical scibox/server/internal/erasure       97  # удаление аккаунта: что стирается и обезличивается (срез 20)
critical scibox/server/internal/audit         97  # журнал действий: только дописывается, пишется в транзакции действия (срез 21)
critical scibox/server/internal/logmask       97  # маска персональных данных и секретов в журнале сервера (срез 22)
critical scibox/server/internal/retention     97  # сроки хранения: что и когда удаляется само (срез 22)
critical scibox/server/internal/dataexport    97  # выгрузка своих данных: чужое не попадает в архив, архив только со свежим паролем (срез 22)
critical scibox/server/internal/blobstore     97  # хранилище файлов: запись целиком или никак, удалённого больше нет (срез 23)
critical scibox/server/internal/antivirus     97  # проверка на вирусы: «не знаем» не значит «чисто» (срез 23)
critical scibox/server/internal/filework      97  # фоновая работа с файлами: проверка, перенос, удаление объектов, чистка осиротевших (срез 23)
critical scibox/server/internal/dbpool        97  # пул соединений: сроки для базы, журнал медленных запросов без значений параметров (срез 24, T-22)
critical scibox/server/internal/httpcache     97  # короткий кеш публичных ответов: только общее для всех, ETag (срез 24)
critical scibox/server/internal/jobs          97  # фоновые задачи: расписание на весь кластер, мягкая остановка, ни одной задачи в двух копиях сразу (срез 25, T-23)
critical scibox/server/internal/resilience    97  # предохранитель и ограничитель внешних сервисов (срез 25, T-24)
