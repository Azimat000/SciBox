# Prometheus для SciBox/ИОН (срез 26). Правила тревог: rules/scibox.yml, их тесты: tests/scibox_test.yml
# (make monitoring-check).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Внутренние порты (SCIBOX_OPS_ADDR): сервер 9100, воркер 9101. Метка service видна в панели и тревогах.
  # В бою порт защищён секретом SCIBOX_OPS_TOKEN: добавить в каждое задание
  #   authorization: { type: Bearer, credentials_file: /run/secrets/scibox_ops_token }
  - job_name: scibox-serve
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { service: serve }
  - job_name: scibox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels: { service: worker }
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
