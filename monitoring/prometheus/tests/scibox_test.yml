# Тесты правил тревог (promtool test rules). Каждая тревога: срабатывает на искусственном сбое и молчит на здоровой
# системе. Запуск: make monitoring-check.
rule_files:
  - ../rules/scibox.yml

evaluation_interval: 1m

tests:
  - name: healthy system is silent except for the watchdog
    interval: 1m
    input_series:
      - series: 'up{job="scibox-serve",instance="s:9100"}'
        values: '1x30'
      - series: 'up{job="scibox-worker",instance="w:9101"}'
        values: '1x30'
      - series: 'scibox_http_requests_total{status="200",route="/api/landing",instance="s:9100"}'
        values: '0+10x30'
      - series: 'scibox_mail_queue_oldest_waiting_seconds{instance="s:9100"}'
        values: '0x30'
      - series: 'node_filesystem_avail_bytes{mountpoint="/"}'
        values: '50000000000x30'
      - series: 'node_filesystem_size_bytes{mountpoint="/"}'
        values: '100000000000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ServerDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ServerErrorsHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 20m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: { severity: none }
            exp_annotations:
              summary: "Служебная: горит всегда. Если её нет в списке тревог, не работает сама система тревог."

  - name: server and worker down
    interval: 1m
    input_series:
      - series: 'up{job="scibox-serve",instance="s:9100"}'
        values: '1 1 1 0 0 0 0 0 0'
      - series: 'up{job="scibox-worker",instance="w:9101"}'
        values: '1 1 1 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ServerDown
        exp_alerts:
          - exp_labels: { severity: critical, job: scibox-serve, instance: "s:9100" }
            exp_annotations:
              summary: "Сервер не отвечает на внутреннем порту"
              description: "Prometheus не может прочитать метрики сервера s:9100 больше минуты: процесс остановлен, порт закрыт или сеть."
      - eval_time: 6m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels: { severity: critical, job: scibox-worker, instance: "w:9101" }
            exp_annotations:
              summary: "Воркер фоновых задач не отвечает"
              description: "Письма, подбор, напоминания и проверка файлов не идут, пока воркер не работает (T-49). Копия сервера с фоновыми задачами их тоже покрывает, но в схеме с воркером он обязателен."

  - name: server errors above one percent
    interval: 1m
    input_series:
      # 100 запросов в минуту, из них 8 ошибок = 8%
      - series: 'scibox_http_requests_total{status="200",route="/api/landing"}'
        values: '0+92x20'
      - series: 'scibox_http_requests_total{status="500",route="/api/landing"}'
        values: '0+8x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ServerErrorsHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Больше 1% запросов заканчиваются ошибкой сервера"
              description: "Доля ответов 5xx за 5 минут: 8%. Подробности по номеру запроса в журнале и в GlitchTip."
      - eval_time: 12m
        alertname: ServerErrorsCritical
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Больше 5% запросов заканчиваются ошибкой сервера"
              description: "Доля ответов 5xx за 2 минуты: 8%. Скорее всего не работает база или внешний сервис."

  - name: few requests do not raise the error alarm
    interval: 1m
    input_series:
      # один запрос в 10 минут и тот с ошибкой: доля 100%, но нагрузки нет
      - series: 'scibox_http_requests_total{status="500",route="/api/landing"}'
        values: '0+1x2 2+1x0'
    alert_rule_test:
      - eval_time: 10m
        alertname: ServerErrorsHigh
        exp_alerts: []

  - name: panic and log errors
    interval: 1m
    input_series:
      - series: 'scibox_panics_total{where="http",service="serve",instance="s:9100",job="scibox-serve"}'
        values: '0 0 0 1 1 1'
      - series: 'scibox_log_events_total{level="error",service="serve",instance="s:9100",job="scibox-serve"}'
        values: '0 0 0 3 3 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: PanicInHandler
        exp_alerts:
          - exp_labels: { severity: warning, where: http, service: serve, instance: "s:9100", job: scibox-serve }
            exp_annotations:
              summary: "Паника в http"
              description: "Перехвачена паника (http) на serve: это ошибка в коде. Стек в журнале и в GlitchTip."
      - eval_time: 5m
        alertname: ErrorsInLog
        exp_alerts:
          - exp_labels: { severity: warning, service: serve }
            exp_annotations:
              summary: "В журнале serve есть записи уровня error"
              description: "За 5 минут: 3. Записи уровня error пишутся только для того, что требует внимания человека."

  - name: mail queue is stale
    interval: 1m
    input_series:
      - series: 'scibox_mail_queue_oldest_waiting_seconds{instance="s:9100"}'
        values: '0 0 100 1000 1000 1000 1000 1000 1000 1000'
    alert_rule_test:
      - eval_time: 4m
        alertname: MailQueueStale
        exp_alerts: []
      - eval_time: 9m
        alertname: MailQueueStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Самое старое письмо ждёт отправки больше 15 минут"
              description: "Ждёт 16m 40s. Проверьте воркер, почтовый сервис и предохранитель почты."

  - name: undelivered mail appears
    interval: 1m
    input_series:
      - series: 'scibox_mail_queue_messages{state="undelivered",instance="s:9100"}'
        values: '0 0 0 2 2 2'
    alert_rule_test:
      - eval_time: 5m
        alertname: MailUndelivered
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Появились окончательно недоставленные письма"
              description: "Получатель отказал или письму больше 3 суток. Подробности в журнале («mail given up»)."

  - name: breaker open for a while
    interval: 1m
    input_series:
      - series: 'scibox_breaker_state{name="mail",instance="s:9100"}'
        values: '0 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: MailServiceBreakerOpen
        exp_alerts: []
      - eval_time: 7m
        alertname: MailServiceBreakerOpen
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Почтовый сервис не отвечает: отправка приостановлена"
              description: "Предохранитель почты открыт больше 5 минут."

  - name: a cluster job that stopped running
    interval: 1m
    input_series:
      # срок 5 минут; последний успех в 100 секунд, и больше ничего: порог 3*300+600 = 1500 с
      - series: 'scibox_job_last_success_timestamp_seconds{task="matching.digests",instance="s:9100"}'
        values: '100x40'
      - series: 'scibox_job_interval_seconds{task="matching.digests",instance="s:9100"}'
        values: '300x40'
      # здоровая задача: успех обновляется каждую минуту
      - series: 'scibox_job_last_success_timestamp_seconds{task="retention",instance="s:9100"}'
        values: '0+60x40'
      - series: 'scibox_job_interval_seconds{task="retention",instance="s:9100"}'
        values: '3600x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: JobNotRunning
        exp_alerts: []
      - eval_time: 36m
        alertname: JobNotRunning
        exp_alerts:
          - exp_labels: { severity: warning, task: matching.digests }
            exp_annotations:
              summary: "Задача matching.digests не выполнялась успешно дольше трёх сроков"
              description: "Прошло 34m 20s. Проверьте воркер и журнал (T-49)."

  - name: a job that keeps failing
    interval: 1m
    input_series:
      - series: 'scibox_job_consecutive_failures{task="retention",instance="s:9100"}'
        values: '0 1 2 3 4 5 6 7 8'
    alert_rule_test:
      - eval_time: 6m
        alertname: JobFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: JobFailing
        exp_alerts:
          - exp_labels: { severity: warning, task: retention }
            exp_annotations:
              summary: "Задача retention падает 8 раз подряд"
              description: "Причина в журнале («job keeps failing») и в GlitchTip."

  - name: files wait for the antivirus
    interval: 1m
    input_series:
      - series: 'scibox_files_oldest_pending_scan_seconds{instance="s:9100"}'
        values: '0 60 600 1900 2000 2100 2200 2300 2400'
      - series: 'scibox_files_pending_scan{instance="s:9100"}'
        values: '0 1 2 5 5 5 5 5 5'
    alert_rule_test:
      - eval_time: 3m
        alertname: FileScanBacklog
        exp_alerts: []
      - eval_time: 8m
        alertname: FileScanBacklog
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Файл ждёт проверки на вирусы больше 30 минут"
              description: "Ждёт 40m 0s, всего в очереди 5. Скорее всего антивирус ClamAV недоступен: до проверки файлы организациям не выдаются (T-44)."

  - name: disk is almost full
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/"}'
        values: '20 14 10 4 4 4 4 4 4 4 4 4 4 4 4 4'
      - series: 'node_filesystem_size_bytes{mountpoint="/"}'
        values: '100x16'
    alert_rule_test:
      - eval_time: 3m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 14m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels: { severity: warning, mountpoint: "/" }
            exp_annotations:
              summary: "На диске осталось меньше 15%"
              description: "Свободно 4%."
      - eval_time: 14m
        alertname: DiskSpaceCritical
        exp_alerts:
          - exp_labels: { severity: critical, mountpoint: "/" }
            exp_annotations:
              summary: "На диске осталось меньше 5%"
              description: "Свободно 4%: база и хранилище вот-вот перестанут писать."

  - name: database pool and limits
    interval: 1m
    input_series:
      - series: 'scibox_db_pool_connections{state="acquired",service="serve",instance="s:9100"}'
        values: '19x10'
      - series: 'scibox_db_pool_max_connections{service="serve",instance="s:9100"}'
        values: '20x10'
      - series: 'scibox_db_server_connections{instance="s:9100"}'
        values: '85x10'
      - series: 'scibox_db_server_max_connections{instance="s:9100"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: DatabasePoolSaturated
        exp_alerts:
          - exp_labels: { severity: warning, service: serve, instance: "s:9100" }
            exp_annotations:
              summary: "Пул соединений serve занят больше чем на 90%"
              description: "Запросы начнут ждать соединение. Проверьте медленные запросы и число копий."
      - eval_time: 8m
        alertname: DatabaseConnectionsNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, instance: "s:9100" }
            exp_annotations:
              summary: "Использовано больше 80% соединений базы"
              description: "Все копии сервера и воркеры вместе держат 85% от max_connections."

  - name: query timeouts
    interval: 1m
    input_series:
      - series: 'scibox_db_query_timeouts_total{query="SearchVacancies",instance="s:9100"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: DatabaseQueryTimeouts
        exp_alerts:
          - exp_labels: { severity: warning, query: SearchVacancies }
            exp_annotations:
              summary: "База остановила запрос SearchVacancies по сроку"
              description: "statement_timeout сработал 1 раз за 10 минут: людям отвечено «сервер занят»."

  - name: clock skew pauses the jobs
    interval: 1m
    input_series:
      - series: 'scibox_jobs_clock_skewed{instance="w:9101"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: JobsPausedByClock
        exp_alerts:
          - exp_labels: { severity: critical, instance: "w:9101" }
            exp_annotations:
              summary: "Часы w:9101 разошлись с часами базы: фоновые задачи остановлены"
              description: "Нужна синхронизация времени (NTP) на этой машине."
